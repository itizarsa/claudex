<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Claudex reset placement prototype</title>
  <!-- Throwaway prototype: three reset placements inside real-width account cards, switchable via ?variant=. -->
  <style>
    :root {
      color-scheme: dark;
      --page: #0b0c0e;
      --panel: #1b1c1f;
      --line: rgba(255, 255, 255, .10);
      --hover: rgba(255, 255, 255, .05);
      --text: #f2f2f4;
      --muted: rgba(242, 242, 244, .62);
      --faint: rgba(242, 242, 244, .43);
      --track: rgba(255, 255, 255, .13);
      --accent: #4b94ef;
      --green: #45cd72;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 28px 16px 104px;
      background: var(--page);
      color: var(--text);
    }

    button { font: inherit; }

    .stage { transform: scale(1.6); transform-origin: center; }
    .popover {
      width: 280px;
      padding: 12px;
      border: .5px solid var(--line);
      border-radius: 12px;
      background: var(--panel);
      box-shadow: 0 20px 60px rgba(0, 0, 0, .55);
    }

    .provider {
      display: flex;
      align-items: center;
      gap: 6px;
      margin: 0 2px 7px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 650;
      letter-spacing: .06em;
    }

    .provider button {
      margin-left: auto;
      width: 24px;
      height: 24px;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
    }

    .card {
      position: relative;
      overflow: hidden;
      padding: 8px 10px;
      border: .5px solid var(--line);
      border-radius: 8px;
    }

    .card::before {
      content: "";
      position: absolute;
      inset: 0 auto 0 0;
      width: 2px;
      background: var(--accent);
    }

    .account { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
    .badge {
      width: 24px;
      height: 24px;
      display: grid;
      place-items: center;
      flex: none;
      border-radius: 50%;
      background: rgba(75, 148, 239, .15);
      color: var(--accent);
      font-size: 12px;
      font-weight: 750;
    }

    .identity { min-width: 0; }
    .name { font-size: 11px; font-weight: 650; }
    .sub { color: var(--faint); font-size: 9px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .variant { display: none; }
    .variant.active { display: grid; gap: 9px; }
    .usage { display: grid; gap: 5px; }
    .usage-head { min-width: 0; }
    .label { color: var(--text); font-size: 13px; font-weight: 520; white-space: nowrap; }
    .secondary .label { color: var(--muted); }
    .reset { color: var(--muted); font-size: 9px; white-space: nowrap; }
    .percent {
      justify-self: end;
      color: var(--green);
      font-size: 13px;
      font-weight: 650;
      font-variant-numeric: tabular-nums;
    }

    .track { height: 3px; overflow: hidden; border-radius: 2px; background: var(--track); }
    .track i { display: block; width: var(--value); height: 100%; background: var(--green); }

    /* A: one baseline. Reset reads as quiet metadata belonging to label. */
    .a .usage-head {
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: baseline;
      gap: 7px;
    }

    /* B: reset gets its own aligned metadata column. Better scanning, more visual machinery. */
    .b .usage-head {
      display: grid;
      grid-template-columns: 53px 1fr auto;
      align-items: center;
      gap: 7px;
    }

    .b .reset-block {
      display: grid;
      grid-template-columns: auto 1fr;
      align-items: baseline;
      gap: 4px;
      min-width: 0;
    }

    .b .reset-key {
      color: var(--faint);
      font-size: 7px;
      font-weight: 650;
      letter-spacing: .06em;
      text-transform: uppercase;
    }

    /* C: reset becomes a compact fact chip directly attached to label. */
    .c .usage-head { display: flex; align-items: baseline; gap: 6px; }
    .c .reset-chip {
      overflow: hidden;
      padding: 2px 5px;
      border-radius: 4px;
      background: rgba(255, 255, 255, .07);
      color: var(--muted);
      font-size: 8px;
      white-space: nowrap;
      text-overflow: ellipsis;
    }
    .c .percent { margin-left: auto; }

    .switcher {
      position: fixed;
      left: 50%;
      bottom: 18px;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px;
      border: 1px solid rgba(255, 255, 255, .15);
      border-radius: 999px;
      background: rgba(27, 28, 31, .96);
      box-shadow: 0 12px 36px rgba(0, 0, 0, .45);
    }

    .switcher button {
      width: 30px;
      height: 28px;
      border: 0;
      border-radius: 999px;
      background: var(--hover);
      color: var(--text);
      cursor: pointer;
    }
    .switcher button:active { transform: scale(.96); }
    .variant-name { min-width: 136px; text-align: center; color: var(--muted); font-size: 11px; font-weight: 600; }

    .state {
      position: fixed;
      top: 14px;
      right: 14px;
      width: 190px;
      padding: 9px 11px;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: #131417;
      color: var(--faint);
      font: 10px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace;
      white-space: pre-wrap;
    }

    @media (max-width: 760px) {
      .stage { transform: scale(1.25); }
      .state { display: none; }
    }
  </style>
</head>
<body>
  <main class="stage">
    <section class="popover" aria-label="Claudex account card reset prototype">
      <header class="provider"><span>CODEX</span><button aria-label="Add Codex account">+</button></header>
      <article class="card">
        <header class="account">
          <div class="badge">AR</div>
          <div class="identity">
            <div class="name">Arshath</div>
            <div class="sub">Plus · arshath@example.com</div>
          </div>
        </header>

        <div class="variant a" data-variant="A">
          <div class="usage">
            <div class="usage-head"><span class="label">Session</span><span class="reset">Resets Today 10:59PM</span><span class="percent">38%</span></div>
            <div class="track" style="--value: 38%"><i></i></div>
          </div>
          <div class="usage secondary">
            <div class="usage-head"><span class="label">Weekly</span><span class="reset">Resets Sep 15, 6:19PM</span><span class="percent">61%</span></div>
            <div class="track" style="--value: 61%"><i></i></div>
          </div>
        </div>

        <div class="variant b" data-variant="B">
          <div class="usage">
            <div class="usage-head"><span class="label">Session</span><span class="reset-block"><span class="reset-key">Reset</span><span class="reset">Today 10:59PM</span></span><span class="percent">38%</span></div>
            <div class="track" style="--value: 38%"><i></i></div>
          </div>
          <div class="usage secondary">
            <div class="usage-head"><span class="label">Weekly</span><span class="reset-block"><span class="reset-key">Reset</span><span class="reset">Sep 15, 6:19PM</span></span><span class="percent">61%</span></div>
            <div class="track" style="--value: 61%"><i></i></div>
          </div>
        </div>

        <div class="variant c" data-variant="C">
          <div class="usage">
            <div class="usage-head"><span class="label">Session</span><span class="reset-chip">Resets Today 10:59PM</span><span class="percent">38%</span></div>
            <div class="track" style="--value: 38%"><i></i></div>
          </div>
          <div class="usage secondary">
            <div class="usage-head"><span class="label">Weekly</span><span class="reset-chip">Resets Sep 15, 6:19PM</span><span class="percent">61%</span></div>
            <div class="track" style="--value: 61%"><i></i></div>
          </div>
        </div>
      </article>
    </section>
  </main>

  <aside class="state" id="state" aria-label="Prototype state"></aside>
  <nav class="switcher" aria-label="Prototype variants">
    <button id="previous" aria-label="Previous variant">&#8592;</button>
    <div class="variant-name" id="variant-name"></div>
    <button id="next" aria-label="Next variant">&#8594;</button>
  </nav>

  <script>
    const variants = [
      { key: "A", name: "Inline reset" },
      { key: "B", name: "Reset column" },
      { key: "C", name: "Reset chip" }
    ];
    const model = {
      session: { usage: 38, resets: "Today 10:59PM" },
      weekly: { usage: 61, resets: "Sep 15, 6:19PM" }
    };
    let current = new URLSearchParams(location.search).get("variant")?.toUpperCase() || "A";
    if (!variants.some(item => item.key === current)) current = "A";

    function render(key, replace = true) {
      current = key;
      document.querySelectorAll(".variant").forEach(node => node.classList.toggle("active", node.dataset.variant === key));
      const item = variants.find(candidate => candidate.key === key);
      document.getElementById("variant-name").textContent = `${item.key}  ${item.name}`;
      document.getElementById("state").textContent = JSON.stringify({ variant: item, data: model }, null, 2);
      const url = new URL(location.href);
      url.searchParams.set("variant", key);
      history[replace ? "replaceState" : "pushState"]({}, "", url);
    }

    function cycle(offset) {
      const index = variants.findIndex(item => item.key === current);
      render(variants[(index + offset + variants.length) % variants.length].key, false);
    }

    document.getElementById("previous").addEventListener("click", () => cycle(-1));
    document.getElementById("next").addEventListener("click", () => cycle(1));
    addEventListener("keydown", event => {
      const tag = document.activeElement?.tagName;
      if (["INPUT", "TEXTAREA"].includes(tag) || document.activeElement?.isContentEditable) return;
      if (event.key === "ArrowLeft") cycle(-1);
      if (event.key === "ArrowRight") cycle(1);
    });
    render(current);
  </script>
</body>
</html>
